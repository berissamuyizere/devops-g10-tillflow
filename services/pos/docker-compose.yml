services:
  postgres:
    image: postgres:16.4-alpine
    container_name: tillflow-pos-pg
    environment:
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: pos
      POSTGRES_DB: tillflow_pos
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos -d tillflow_pos"]
      interval: 2s
      timeout: 5s
      retries: 15
