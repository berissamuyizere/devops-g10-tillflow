services:
  postgres:
    image: postgres:16.4-alpine
    container_name: tillflow-payments-pg
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
      POSTGRES_DB: tillflow_payments
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d tillflow_payments"]
      interval: 2s
      timeout: 5s
      retries: 15
