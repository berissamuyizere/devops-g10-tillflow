name: PR checks

on:
  pull_request:
    branches: [develop, main]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  iac-scan:
    name: IaC scan (Trivy config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Run Trivy from its official Docker image. This avoids the
      # aquasecurity/trivy-action tag churn and the release-tarball
      # naming inconsistencies (`Linux-64bit.tar.gz` vs
      # `linux-amd64.tar.gz` vs `linux-64bit.tar.gz` — different
      # versions ship different names, and the CI failure log shows a
      # 404 either way). The container ships everything Trivy needs
      # and is pinned by tag.
      #
      # `trivy config` does NOT accept `--ignore-unfixed` or
      # `--no-progress` — those are `trivy image` flags. Config findings
      # are always "fixable" (change your IaC); acceptance goes in
      # .trivyignore with a justification, owner, and expiry date.
      - name: Trivy config scan (infra/)
        env:
          TRIVY_VERSION: '0.56.2'
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/scan" \
            -w /scan \
            "aquasec/trivy:${TRIVY_VERSION}" \
            config infra/ \
              --severity HIGH,CRITICAL \
              --exit-code 1 \
              --ignorefile .trivyignore \
              --tf-exclude-downloaded-modules

  terraform:
    name: Terraform fmt + validate + plan
    runs-on: ubuntu-latest
    needs: [gitleaks, iac-scan]
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform validate (init without backend)
        run: |
          terraform init -backend=false
          terraform validate

      # Plan runs against real state. Requires that infra/bootstrap has been
      # applied once and the CI OIDC role exists. On first-ever run of a
      # brand-new account the plan job will fail; that's expected — merge
      # the bootstrap PR first, then re-run.
      - name: Configure AWS credentials (OIDC)
        if: ${{ vars.AWS_CI_ROLE_ARN != '' && vars.TF_STATE_BUCKET != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          aws-region: eu-central-1

      - name: terraform init (remote backend)
        if: ${{ vars.AWS_CI_ROLE_ARN != '' && vars.TF_STATE_BUCKET != '' }}
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="dynamodb_table=devops-g10-tflock" \
            -backend-config="region=eu-central-1" \
            -backend-config="key=platform/terraform.tfstate"

      - name: terraform plan
        if: ${{ vars.AWS_CI_ROLE_ARN != '' && vars.TF_STATE_BUCKET != '' }}
        run: terraform plan -input=false -no-color -out=plan.bin

      - name: Upload plan
        if: ${{ vars.AWS_CI_ROLE_ARN != '' && vars.TF_STATE_BUCKET != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: infra/plan.bin
          retention-days: 14

  services:
    name: Service lint + test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [web, pos, payments]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            svc:
              - 'services/${{ matrix.service }}/**'
              - '.github/workflows/pr.yml'
            shared:
              - 'services/_shared/**'

      - name: Decide whether this service runs
        id: run
        run: |
          if [ "${{ steps.changes.outputs.svc }}" = "true" ] || \
             { [ "${{ matrix.service }}" = "payments" ] && [ "${{ steps.changes.outputs.shared }}" = "true" ]; }; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.run.outputs.go == 'true'
        with:
          node-version: '20.17'
          cache: 'npm'
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json

      - name: Install
        if: steps.run.outputs.go == 'true'
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund --no-progress
          else
            npm install --no-audit --no-fund --no-progress
          fi

      - name: Start Postgres (pos)
        if: matrix.service == 'pos' && steps.run.outputs.go == 'true'
        run: docker compose up -d --wait

      - name: Migrate (pos)
        if: matrix.service == 'pos' && steps.run.outputs.go == 'true'
        env:
          DATABASE_URL: postgres://pos:pos@127.0.0.1:5433/tillflow_pos
        run: npm run migrate

      - name: Start Postgres (payments)
        if: matrix.service == 'payments' && steps.run.outputs.go == 'true'
        run: docker compose up -d --wait

      - name: Migrate (payments)
        if: matrix.service == 'payments' && steps.run.outputs.go == 'true'
        env:
          DATABASE_URL: postgres://payments:payments@127.0.0.1:5434/tillflow_payments
        run: npm run migrate

      - name: Lint
        if: steps.run.outputs.go == 'true'
        run: npm run lint --if-present

      - name: Test
        if: steps.run.outputs.go == 'true'
        env:
          DATABASE_URL: ${{ matrix.service == 'payments'
            && 'postgres://payments:payments@127.0.0.1:5434/tillflow_payments'
            || 'postgres://pos:pos@127.0.0.1:5433/tillflow_pos' }}
          PAYMENTS_SERVICE_TOKEN: dev-payments-token
          MPESA_MODE: fake
        run: npm test --if-present

      - name: Docker build (validate)
        if: steps.run.outputs.go == 'true'
        run: |
          if [ "${{ matrix.service }}" = "payments" ]; then
            docker build -f "${GITHUB_WORKSPACE}/services/payments/Dockerfile" \
              -t local/payments:pr "${GITHUB_WORKSPACE}"
          else
            docker build -t local/${{ matrix.service }}:pr .
          fi
