name: Release

# Single main-branch pipeline. PR review + pr.yml plan is the gate.
# Merge to main (or a manual run) then:
#   1. terraform apply when infra changed
#   2. build / scan / push / ECS rolling update / smoke when web changed
# Changing this file counts as both, so the first merge applies IAM then
# deploys the real web image (no race).
#
# Not in this workflow (one-time, cannot be Terraform/OIDC bootstrapped):
#   - infra/bootstrap (state bucket + lock table) — already applied
#   - GitHub Actions variables AWS_CI_ROLE_ARN, TF_STATE_BUCKET
#   - secret *values* (Daraja, Slack) — ARNs exist, fill out-of-band
# CodePipeline is optional and still needs a console GitHub App connection.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-central-1
  ECR_REPO_NAME: devops-g10/web
  ECS_CLUSTER: devops-g10
  ECS_SERVICE: devops-g10-web
  ECS_TASK_FAMILY: devops-g10-web
  ECS_CONTAINER: app

jobs:
  changes:
    name: Detect paths
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.out.outputs.infra }}
      web: ${{ steps.out.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            infra:
              - 'infra/**'
              - '.github/workflows/release.yml'
            web:
              - 'services/web/**'
              - 'services/_shared/**'
              - '.github/workflows/release.yml'
      - id: out
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "infra=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "infra=${{ steps.filter.outputs.infra }}" >> "$GITHUB_OUTPUT"
            echo "web=${{ steps.filter.outputs.web }}" >> "$GITHUB_OUTPUT"
          fi

  apply:
    name: terraform apply
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          aws-region: eu-central-1
          audience: sts.amazonaws.com

      - name: terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="dynamodb_table=devops-g10-tflock" \
            -backend-config="region=eu-central-1" \
            -backend-config="key=platform/terraform.tfstate"

      - name: terraform plan
        run: terraform plan -input=false -no-color -lock-timeout=5m -out=plan.bin

      - name: terraform apply
        run: terraform apply -input=false -auto-approve plan.bin

      - name: Output
        run: terraform output -no-color

  web:
    name: web build + deploy
    needs: [changes, apply]
    if: >-
      always()
      && !cancelled()
      && (needs.apply.result == 'success' || needs.apply.result == 'skipped')
      && needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: ECR login
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build image (SHA tag, linux/arm64)
        id: build
        working-directory: services/web
        run: |
          set -euo pipefail
          IMAGE="${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO_NAME }}:${GITHUB_SHA}"
          docker buildx build \
            --platform linux/arm64 \
            --file Dockerfile \
            --tag "${IMAGE}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --load \
            .
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Trivy image scan (fail on fixable HIGH/CRITICAL)
        env:
          TRIVY_VERSION: '0.56.2'
        run: |
          set -euo pipefail
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            "aquasec/trivy:${TRIVY_VERSION}" \
            image \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --scanners vuln \
              --exit-code 1 \
              --no-progress \
              "${{ steps.build.outputs.image }}"

      - name: SBOM (syft)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.build.outputs.image }}
          format: spdx-json
          output-file: sbom-web.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-web-${{ github.sha }}
          path: sbom-web.spdx.json

      - name: Push image
        run: docker push "${{ steps.build.outputs.image }}"

      - name: Resolve digest + rolling-update ECS
        run: |
          set -euo pipefail
          DIGEST=$(aws ecr describe-images \
            --repository-name "${{ env.ECR_REPO_NAME }}" \
            --image-ids imageTag="${GITHUB_SHA}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)
          IMAGE_URI="${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO_NAME }}@${DIGEST}"
          echo "Deploying ${IMAGE_URI}"

          aws ecs describe-task-definition \
            --task-definition "${{ env.ECS_TASK_FAMILY }}" \
            --query taskDefinition > td-raw.json

          jq \
            --arg image "${IMAGE_URI}" \
            --arg commit "${GITHUB_SHA}" \
            --arg digest "${DIGEST}" \
            --arg cname "${{ env.ECS_CONTAINER }}" \
            'del(
                .taskDefinitionArn, .revision, .status, .requiresAttributes,
                .compatibilities, .registeredAt, .registeredBy, .deregisteredAt
              )
              | .containerDefinitions |= map(
                  if .name == $cname then
                    .image = $image
                    | .environment = (
                        ((.environment // []) | map(select(.name != "COMMIT_SHA" and .name != "IMAGE_DIGEST")))
                        + [
                            {name: "COMMIT_SHA", value: $commit},
                            {name: "IMAGE_DIGEST", value: $digest}
                          ]
                      )
                  else . end
                )' \
            td-raw.json > td.json

          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://td.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "Registered ${NEW_ARN}"

          aws ecs update-service \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --service "${{ env.ECS_SERVICE }}" \
            --task-definition "${NEW_ARN}" \
            --force-new-deployment \
            >/dev/null

          echo "Waiting for ECS service stability..."
          aws ecs wait services-stable \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --services "${{ env.ECS_SERVICE }}"

      - name: Smoke /health and /version
        run: |
          set -euo pipefail
          API_URL=$(aws apigatewayv2 get-apis \
            --query "Items[?Name=='devops-g10-api'].ApiEndpoint" \
            --output text)
          if [ -z "${API_URL}" ] || [ "${API_URL}" = "None" ]; then
            echo "Could not resolve API Gateway URL" >&2
            exit 1
          fi
          echo "Smoking ${API_URL}"
          curl -sSf --retry 8 --retry-all-errors --retry-delay 5 \
            "${API_URL}/health" | tee smoke-health.json
          echo
          curl -sSf --retry 5 --retry-all-errors --retry-delay 3 \
            "${API_URL}/version" | tee smoke-version.json
          echo
          python3 - <<'PY'
          import json, os, sys
          health = json.load(open("smoke-health.json"))
          version = json.load(open("smoke-version.json"))
          sha = os.environ["GITHUB_SHA"]
          if health.get("status") != "ok":
              sys.exit(f"health not ok: {health}")
          if version.get("commit") != sha:
              sys.exit(f"version commit {version.get('commit')} != {sha}")
          print("smoke ok", health, version)
          PY
