name: Release

# Single main-branch pipeline.
#   1. path-detect
#   2. terraform plan (saved artifact) when infra changed
#   3. terraform apply of THAT plan behind environment `production`
#   4. build / scan / push / ECS roll for web | pos | payments | commission
#   5. DB bootstrap + migrate when pos/payments images change
#
# Not in this workflow (one-time / out-of-band):
#   - infra/bootstrap (state bucket + lock table)
#   - GitHub variables AWS_CI_ROLE_ARN, TF_STATE_BUCKET
#   - GitHub Environment `production` required reviewers
#   - Daraja sandbox secret values (G3)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-central-1
  ECS_CLUSTER: devops-g10
  ECS_CONTAINER: app

jobs:
  changes:
    name: Detect paths
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.out.outputs.infra }}
      web: ${{ steps.out.outputs.web }}
      pos: ${{ steps.out.outputs.pos }}
      payments: ${{ steps.out.outputs.payments }}
      commission: ${{ steps.out.outputs.commission }}
      backend: ${{ steps.out.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            infra:
              - 'infra/**'
              - '.github/workflows/release.yml'
            web:
              - 'services/web/**'
              - 'services/_shared/**'
              - '.github/workflows/release.yml'
            pos:
              - 'services/pos/**'
              - 'services/_shared/**'
              - '.github/workflows/release.yml'
            payments:
              - 'services/payments/**'
              - 'services/_shared/**'
              - '.github/workflows/release.yml'
            commission:
              - 'services/commission/**'
              - 'services/_shared/**'
              - '.github/workflows/release.yml'
      - id: out
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "infra=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "pos=true" >> "$GITHUB_OUTPUT"
            echo "payments=true" >> "$GITHUB_OUTPUT"
            echo "commission=true" >> "$GITHUB_OUTPUT"
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "infra=${{ steps.filter.outputs.infra }}" >> "$GITHUB_OUTPUT"
            echo "web=${{ steps.filter.outputs.web }}" >> "$GITHUB_OUTPUT"
            echo "pos=${{ steps.filter.outputs.pos }}" >> "$GITHUB_OUTPUT"
            echo "payments=${{ steps.filter.outputs.payments }}" >> "$GITHUB_OUTPUT"
            echo "commission=${{ steps.filter.outputs.commission }}" >> "$GITHUB_OUTPUT"
            if [ "${{ steps.filter.outputs.pos }}" = "true" ] || [ "${{ steps.filter.outputs.payments }}" = "true" ] || [ "${{ steps.filter.outputs.infra }}" = "true" ]; then
              echo "backend=true" >> "$GITHUB_OUTPUT"
            else
              echo "backend=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  plan:
    name: terraform plan
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          aws-region: eu-central-1
          audience: sts.amazonaws.com
      - name: terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="dynamodb_table=devops-g10-tflock" \
            -backend-config="region=eu-central-1" \
            -backend-config="key=platform/terraform.tfstate"
      - name: Adopt Grafana workspace from a failed apply
        run: bash scripts/adopt-grafana-workspace.sh
      - name: terraform plan
        run: |
          terraform plan -input=false -no-color -lock-timeout=5m -out=plan.bin
          terraform show -no-color plan.bin | tee plan.txt
      # archive_file writes probe/lambda zips under infra/.build during
      # plan. Apply is a fresh runner and terraform apply plan.bin still
      # reads those paths from disk — ship them with the plan.
      - name: Upload saved plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ github.sha }}
          path: |
            infra/plan.bin
            infra/plan.txt
            infra/.build/
          retention-days: 14

  apply:
    name: terraform apply
    needs: [changes, plan]
    if: needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          aws-region: eu-central-1
          audience: sts.amazonaws.com
      - name: Download saved plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ github.sha }}
          path: infra
      - name: Drop leftover Synthetics canary (account Lambda max 512 MB)
        run: |
          set +e
          aws synthetics delete-canary --name devops-g10-probe --delete-lambda
          true
      - name: Rebuild lambda/canary zips if the plan artifact omitted them
        run: |
          set -euo pipefail
          mkdir -p .build
          if [ ! -f .build/payout_cutoff.zip ]; then
            zip -j .build/payout_cutoff.zip lambda/payout_cutoff/index.py
          fi
          if [ ! -f .build/slack_notifier.zip ]; then
            zip -j .build/slack_notifier.zip lambda/slack_notifier/index.py
          fi
          if [ ! -f .build/probe.zip ]; then
            zip -j .build/probe.zip lambda/probe/index.py
          fi
      - name: terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="dynamodb_table=devops-g10-tflock" \
            -backend-config="region=eu-central-1" \
            -backend-config="key=platform/terraform.tfstate"
      - name: terraform apply saved plan
        run: terraform apply -input=false plan.bin
      - name: Output
        run: terraform output -no-color

  deploy:
    name: build + deploy (${{ matrix.service }})
    needs: [changes, plan, apply]
    if: >-
      always()
      && !cancelled()
      && (needs.plan.result == 'success' || needs.plan.result == 'skipped')
      && (needs.apply.result == 'success' || needs.apply.result == 'skipped')
    # Native ARM64 runner: builds linux/arm64 without QEMU. QEMU user-mode
    # was crashing during `npm ci` on the OTel/native-crypto graph
    # ("qemu: uncaught target signal 4 (Illegal instruction) - core dumped"),
    # which left buildx waiting on a dead layer until the job hit its
    # timeout. Native runner side-steps the whole emulation path.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: web
            ecr_repo: devops-g10/web
            ecs_service: devops-g10-web
            ecs_family: devops-g10-web
            tg_name: devops-g10-web-tg
            build_context: services/web
            dockerfile: services/web/Dockerfile
          - service: pos
            ecr_repo: devops-g10/pos
            ecs_service: devops-g10-pos
            ecs_family: devops-g10-pos
            tg_name: devops-g10-pos-tg
            build_context: services/pos
            dockerfile: services/pos/Dockerfile
          - service: payments
            ecr_repo: devops-g10/payments
            ecs_service: devops-g10-payments
            ecs_family: devops-g10-payments
            tg_name: devops-g10-payments-tg
            build_context: .
            dockerfile: services/payments/Dockerfile
          - service: commission
            ecr_repo: devops-g10/commission
            ecs_service: devops-g10-commission
            ecs_family: devops-g10-commission
            tg_name: ""
            build_context: services/commission
            dockerfile: services/commission/Dockerfile
    steps:
      - name: Should this service run?
        id: gate
        run: |
          case "${{ matrix.service }}" in
            web) FLAG="${{ needs.changes.outputs.web }}" ;;
            pos) FLAG="${{ needs.changes.outputs.pos }}" ;;
            payments) FLAG="${{ needs.changes.outputs.payments }}" ;;
            commission) FLAG="${{ needs.changes.outputs.commission }}" ;;
          esac
          echo "run=${FLAG}" >> "$GITHUB_OUTPUT"
          echo "service=${{ matrix.service }} run=${FLAG}"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - name: Configure AWS credentials (OIDC)
        if: steps.gate.outputs.run == 'true'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: ECR login
        if: steps.gate.outputs.run == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # No setup-qemu: we're on a native linux/arm64 runner, so builds
      # for --platform linux/arm64 are native and don't need emulation.
      - uses: docker/setup-buildx-action@v3
        if: steps.gate.outputs.run == 'true'

      - name: Build image (SHA tag, linux/arm64)
        if: steps.gate.outputs.run == 'true'
        id: build
        run: |
          set -euo pipefail
          IMAGE="${{ steps.ecr.outputs.registry }}/${{ matrix.ecr_repo }}:${GITHUB_SHA}"
          docker buildx build \
            --platform linux/arm64 \
            --file "${{ matrix.dockerfile }}" \
            --tag "${IMAGE}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --load \
            "${{ matrix.build_context }}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Trivy image scan (fail on fixable HIGH/CRITICAL)
        if: steps.gate.outputs.run == 'true'
        env:
          TRIVY_VERSION: '0.56.2'
        run: |
          set -euo pipefail
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            "aquasec/trivy:${TRIVY_VERSION}" \
            image \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --scanners vuln \
              --exit-code 1 \
              --no-progress \
              "${{ steps.build.outputs.image }}"

      - name: SBOM (syft)
        if: steps.gate.outputs.run == 'true'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.build.outputs.image }}
          format: spdx-json
          output-file: sbom-${{ matrix.service }}.spdx.json

      - name: Upload SBOM
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.service }}-${{ github.sha }}
          path: sbom-${{ matrix.service }}.spdx.json

      - name: Push image
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          if aws ecr describe-images \
            --repository-name "${{ matrix.ecr_repo }}" \
            --image-ids imageTag="${GITHUB_SHA}" \
            >/dev/null 2>&1; then
            echo "ECR tag ${GITHUB_SHA} already exists (immutable); reuse digest"
          else
            docker push "${{ steps.build.outputs.image }}"
          fi

      - name: Resolve digest + rolling-update ECS
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          DIGEST=$(aws ecr describe-images \
            --repository-name "${{ matrix.ecr_repo }}" \
            --image-ids imageTag="${GITHUB_SHA}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)
          IMAGE_URI="${{ steps.ecr.outputs.registry }}/${{ matrix.ecr_repo }}@${DIGEST}"
          echo "Deploying ${IMAGE_URI}"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

          aws ecs describe-task-definition \
            --task-definition "${{ matrix.ecs_family }}" \
            --query taskDefinition > td-raw.json

          ADOT_CONFIG=$(aws ssm get-parameter \
            --name /devops-g10/adot/config \
            --query Parameter.Value \
            --output text)
          APP_ENV=$(aws ssm get-parameter \
            --name "/devops-g10/${{ matrix.service }}/env" \
            --output json | jq -r .Parameter.Value)
          echo "${APP_ENV}" | jq -e '.environment' >/dev/null

          jq \
            --arg image "${IMAGE_URI}" \
            --arg commit "${GITHUB_SHA}" \
            --arg digest "${DIGEST}" \
            --arg cname "${{ env.ECS_CONTAINER }}" \
            --arg adot_config "${ADOT_CONFIG}" \
            --argjson overlay "${APP_ENV}" \
            'del(
                .taskDefinitionArn, .revision, .status, .requiresAttributes,
                .compatibilities, .registeredAt, .registeredBy, .deregisteredAt
              )
              | .containerDefinitions |= map(
                  if .name == $cname then
                    .image = $image
                    | del(.command, .entryPoint)
                    | .dependsOn = [{containerName: "adot", condition: "HEALTHY"}]
                    | .environment = (
                        ($overlay.environment // [])
                        + [
                            {name: "COMMIT_SHA", value: $commit},
                            {name: "IMAGE_DIGEST", value: $digest}
                          ]
                      )
                    | .secrets = ($overlay.secrets // [])
                  elif .name == "adot" then
                    del(.user)
                    | .environment = (
                        ((.environment // []) | map(select(.name != "AOT_CONFIG_CONTENT")))
                        + [{name: "AOT_CONFIG_CONTENT", value: $adot_config}]
                      )
                    | .healthCheck = {
                      command: ["CMD", "/healthcheck"],
                      interval: 10,
                      timeout: 5,
                      retries: 5,
                      startPeriod: 30
                    }
                  else . end
                )' \
            td-raw.json > td.json

          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://td.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "Registered ${NEW_ARN}"

          aws ecs update-service \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --service "${{ matrix.ecs_service }}" \
            --task-definition "${NEW_ARN}" \
            --force-new-deployment \
            >/dev/null

          echo "Waiting for ECS service stability..."
          aws ecs wait services-stable \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --services "${{ matrix.ecs_service }}"

      - name: Smoke
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          API_URL=$(aws apigatewayv2 get-apis \
            --query "Items[?Name=='devops-g10-api'].ApiEndpoint" \
            --output text)
          if [ -n "${{ matrix.tg_name }}" ]; then
            TG=$(aws elbv2 describe-target-groups --names "${{ matrix.tg_name }}" \
              --query 'TargetGroups[0].TargetGroupArn' --output text)
            echo "target health for ${{ matrix.tg_name }}:"
            aws elbv2 describe-target-health --target-group-arn "$TG"
          fi

          case "${{ matrix.service }}" in
            web)
              curl -sSf --retry 8 --retry-all-errors --retry-delay 5 \
                "${API_URL}/health" | tee smoke-health.json
              echo
              curl -sSf --retry 5 --retry-all-errors --retry-delay 3 \
                "${API_URL}/ready" | tee smoke-ready.json
              echo
              curl -sSf --retry 5 --retry-all-errors --retry-delay 3 \
                "${API_URL}/version" | tee smoke-version.json
              echo
              python3 - <<'PY'
          import json, os, sys
          health = json.load(open("smoke-health.json"))
          ready = json.load(open("smoke-ready.json"))
          version = json.load(open("smoke-version.json"))
          sha = os.environ["GITHUB_SHA"]
          if health.get("status") != "ok":
              sys.exit(f"health not ok: {health}")
          if ready.get("status") != "ready":
              sys.exit(f"ready not ready: {ready}")
          if version.get("commit") != sha:
              sys.exit(f"version commit {version.get('commit')} != {sha}")
          if version.get("service") != "web":
              sys.exit(f"version service not web: {version}")
          print("web smoke ok", health, ready, version)
          PY
              ;;
            pos)
              # Unauthenticated POST must hit POS (401 from auth middleware),
              # not web 501 or ALB 404. 401 proves the request reached POS and
              # its auth ran before body validation.
              CODE=$(curl -sS -o /tmp/pos-body.json -w "%{http_code}" --retry 8 --retry-all-errors --retry-delay 3 \
                -X POST "${API_URL}/sales" -H 'content-type: application/json' -d '{}')
              echo "POST /sales -> ${CODE}"
              cat /tmp/pos-body.json; echo
              test "${CODE}" = "401"
              DIGEST=$(aws ecs describe-task-definition --task-definition "${{ matrix.ecs_family }}" \
                --query 'taskDefinition.containerDefinitions[?name==`app`].image' --output text)
              echo "${DIGEST}" | grep -q '@sha256:'
              echo "${DIGEST}" | grep -q "${GITHUB_SHA}" || echo "${DIGEST}" | grep -q 'sha256:'
              echo "pos smoke ok (${DIGEST})"
              ;;
            payments)
              # Edge lockdown: API GW stamps x-tillflow-edge=public; ALB
              # returns 404 for stamped /internal/*. 401 would mean the
              # block missed and Payments auth still ran.
              CODE=$(curl -sS -o /tmp/pay-body.json -w "%{http_code}" --retry 8 --retry-all-errors --retry-delay 3 \
                "${API_URL}/internal/v1/payments/00000000-0000-0000-0000-000000000001")
              echo "GET /internal/v1/payments/:id -> ${CODE}"
              cat /tmp/pay-body.json; echo
              test "${CODE}" = "404"
              DIGEST=$(aws ecs describe-task-definition --task-definition "${{ matrix.ecs_family }}" \
                --query 'taskDefinition.containerDefinitions[?name==`app`].image' --output text)
              echo "${DIGEST}" | grep -q '@sha256:'
              echo "payments smoke ok (${DIGEST})"
              ;;
            commission)
              DIGEST=$(aws ecs describe-task-definition --task-definition "${{ matrix.ecs_family }}" \
                --query 'taskDefinition.containerDefinitions[?name==`app`].image' --output text)
              echo "${DIGEST}" | grep -q '@sha256:'
              TASK=$(aws ecs list-tasks --cluster devops-g10 --service-name devops-g10-commission \
                --desired-status RUNNING --query 'taskArns[0]' --output text)
              test -n "${TASK}"
              HEALTH=$(aws ecs describe-tasks --cluster devops-g10 --tasks "${TASK}" \
                --query 'tasks[0].containers[?name==`app`].healthStatus | [0]' --output text)
              echo "commission app health=${HEALTH} image=${DIGEST}"
              test "${HEALTH}" = "HEALTHY"
              echo "commission smoke ok (no ALB, SQS worker)"
              ;;
          esac

  db-migrate:
    name: DB bootstrap + migrate
    needs: [changes, plan, apply, deploy]
    if: >-
      always()
      && !cancelled()
      && (needs.plan.result == 'success' || needs.plan.result == 'skipped')
      && (needs.apply.result == 'success' || needs.apply.result == 'skipped')
      && needs.deploy.result == 'success'
      && needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Run DB bootstrap (schemas + roles)
        run: |
          set -euo pipefail
          SUBNETS=$(aws ecs describe-services --cluster devops-g10 --services devops-g10-pos \
            --query 'services[0].networkConfiguration.awsvpcConfiguration.subnets' --output text | tr '\t' ',')
          SGS=$(aws ecs describe-services --cluster devops-g10 --services devops-g10-pos \
            --query 'services[0].networkConfiguration.awsvpcConfiguration.securityGroups' --output text | tr '\t' ',')
          TASK_ARN=$(aws ecs run-task \
            --cluster devops-g10 \
            --task-definition devops-g10-db-bootstrap \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${SUBNETS}],securityGroups=[${SGS}],assignPublicIp=DISABLED}" \
            --query 'tasks[0].taskArn' --output text)
          TASK_ID="${TASK_ARN##*/}"
          echo "bootstrap task ${TASK_ARN}"
          aws ecs wait tasks-stopped --cluster devops-g10 --tasks "${TASK_ARN}"
          aws ecs describe-tasks --cluster devops-g10 --tasks "${TASK_ARN}" \
            --query 'tasks[0].{stoppedReason:stoppedReason,containers:containers[].{name:name,exitCode:exitCode,reason:reason}}' \
            --output json
          echo "--- CloudWatch logs ---"
          aws logs tail /devops-g10/db-migrate --since 30m \
            --log-stream-name-prefix "bootstrap/bootstrap/${TASK_ID}" 2>&1 || true
          EXIT=$(aws ecs describe-tasks --cluster devops-g10 --tasks "${TASK_ARN}" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          echo "bootstrap exit=${EXIT}"
          test "${EXIT}" = "0"

      - name: Migrate POS schema
        if: needs.changes.outputs.pos == 'true' || needs.changes.outputs.infra == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          IMAGE=$(aws ecs describe-task-definition --task-definition devops-g10-pos \
            --query 'taskDefinition.containerDefinitions[?name==`app`].image | [0]' --output text)
          if echo "${IMAGE}" | grep -qi busybox; then
            echo "POS still on busybox placeholder (${IMAGE}); skip migrate"
            exit 0
          fi
          SUBNETS=$(aws ecs describe-services --cluster devops-g10 --services devops-g10-pos \
            --query 'services[0].networkConfiguration.awsvpcConfiguration.subnets' --output text | tr '\t' ',')
          SGS=$(aws ecs describe-services --cluster devops-g10 --services devops-g10-pos \
            --query 'services[0].networkConfiguration.awsvpcConfiguration.securityGroups' --output text | tr '\t' ',')
          OVERRIDES=$(jq -n '{
            containerOverrides: [{
              name: "app",
              command: ["node", "bin/migrate.js", "up"]
            }]
          }')
          TASK_ARN=$(aws ecs run-task \
            --cluster devops-g10 \
            --task-definition devops-g10-pos \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${SUBNETS}],securityGroups=[${SGS}],assignPublicIp=DISABLED}" \
            --overrides "${OVERRIDES}" \
            --query 'tasks[0].taskArn' --output text)
          TASK_ID="${TASK_ARN##*/}"
          echo "pos migrate ${TASK_ARN}"
          aws ecs wait tasks-stopped --cluster devops-g10 --tasks "${TASK_ARN}"
          echo "--- describe-tasks ---"
          aws ecs describe-tasks --cluster devops-g10 --tasks "${TASK_ARN}" \
            --query 'tasks[0].{stoppedReason:stoppedReason,containers:containers[].{name:name,exitCode:exitCode,reason:reason}}' \
            --output json
          echo "--- app CloudWatch logs ---"
          aws logs tail /devops-g10/pos --since 30m \
            --log-stream-name-prefix "app/app/${TASK_ID}" 2>&1 || true
          echo "--- adot CloudWatch logs ---"
          aws logs tail /devops-g10/adot/pos --since 30m \
            --log-stream-name-prefix "adot/adot/${TASK_ID}" 2>&1 || true
          EXIT=$(aws ecs describe-tasks --cluster devops-g10 --tasks "${TASK_ARN}" \
            --query 'tasks[0].containers[?name==`app`].exitCode | [0]' --output text)
          echo "pos migrate exit=${EXIT}"
          test "${EXIT}" = "0"

      - name: Migrate Payments schema
        if: needs.changes.outputs.payments == 'true' || needs.changes.outputs.infra == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          IMAGE=$(aws ecs describe-task-definition --task-definition devops-g10-payments \
            --query 'taskDefinition.containerDefinitions[?name==`app`].image | [0]' --output text)
          if echo "${IMAGE}" | grep -qi busybox; then
            echo "Payments still on busybox placeholder (${IMAGE}); skip migrate"
            exit 0
          fi
          SUBNETS=$(aws ecs describe-services --cluster devops-g10 --services devops-g10-payments \
            --query 'services[0].networkConfiguration.awsvpcConfiguration.subnets' --output text | tr '\t' ',')
          SGS=$(aws ecs describe-services --cluster devops-g10 --services devops-g10-payments \
            --query 'services[0].networkConfiguration.awsvpcConfiguration.securityGroups' --output text | tr '\t' ',')
          OVERRIDES=$(jq -n '{
            containerOverrides: [{
              name: "app",
              command: ["node", "bin/migrate.js", "up"]
            }]
          }')
          TASK_ARN=$(aws ecs run-task \
            --cluster devops-g10 \
            --task-definition devops-g10-payments \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${SUBNETS}],securityGroups=[${SGS}],assignPublicIp=DISABLED}" \
            --overrides "${OVERRIDES}" \
            --query 'tasks[0].taskArn' --output text)
          TASK_ID="${TASK_ARN##*/}"
          echo "payments migrate ${TASK_ARN}"
          aws ecs wait tasks-stopped --cluster devops-g10 --tasks "${TASK_ARN}"
          echo "--- describe-tasks ---"
          aws ecs describe-tasks --cluster devops-g10 --tasks "${TASK_ARN}" \
            --query 'tasks[0].{stoppedReason:stoppedReason,containers:containers[].{name:name,exitCode:exitCode,reason:reason}}' \
            --output json
          echo "--- app CloudWatch logs ---"
          aws logs tail /devops-g10/payments --since 30m \
            --log-stream-name-prefix "app/app/${TASK_ID}" 2>&1 || true
          echo "--- adot CloudWatch logs ---"
          aws logs tail /devops-g10/adot/payments --since 30m \
            --log-stream-name-prefix "adot/adot/${TASK_ID}" 2>&1 || true
          EXIT=$(aws ecs describe-tasks --cluster devops-g10 --tasks "${TASK_ARN}" \
            --query 'tasks[0].containers[?name==`app`].exitCode | [0]' --output text)
          echo "payments migrate exit=${EXIT}"
          test "${EXIT}" = "0"
